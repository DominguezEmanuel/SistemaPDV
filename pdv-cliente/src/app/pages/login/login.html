<div class="page-shell">
  <div class="washes" aria-hidden="true">
    <div class="wash wash-1"></div>
    <div class="wash wash-2"></div>
  </div>

  <div class="ring-deco r1" aria-hidden="true"></div>
  <div class="ring-deco r2" aria-hidden="true"></div>

  <div class="login-card">
    <!-- Logo -->
    <div class="logo-wrap">
      <img src="assets/images/logo.jpg" alt="Romina Albornoz Logo" />
    </div>
    <!-- Nombre de la empresa -->
    <div class="brand-name">Romina Albornoz</div>
    <div class="brand-sub">Insumos</div>
    <!-- Formulario Login -->
    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" novalidate>
      <!-- Campo nombre de usuario -->
      <div class="input-group-custom">
        <label class="form-label" for="username">Usuario</label>
        <div class="field-wrap">
          <!-- Botón usuario -->
          <i class="bi bi-person field-icon"></i>
          <!-- Input para ingresar nombre de usuario -->
          <input
            id="username"
            name="username"
            type="text"
            class="form-control-custom"
            placeholder="Tu usuario"
            [(ngModel)]="username"
            required
          />
        </div>
      </div>
      <!-- Campo contraseña -->
      <div class="input-group-custom">
        <label class="form-label" for="password">Contraseña</label>
        <div class="field-wrap">
          <!-- Botón candado -->
          <i class="bi bi-lock field-icon"></i>
          <!-- Input para ingresar contraseña -->
          <input
            id="password"
            name="password"
            [type]="showPassword ? 'text' : 'password'"
            class="form-control-custom"
            placeholder="Tu contraseña"
            [(ngModel)]="password"
            required
          />
          <!-- Botón para mostrar/ocultar la contraseña -->
          <button
            type="button"
            class="field-action-btn"
            [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            (click)="showPassword = !showPassword"
          >
            <i
              class="bi"
              [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"
            ></i>
          </button>
        </div>
      </div>

      <!-- Mensaje de error -->
      <div *ngIf="errorMessage" class="alert alert-danger py-2 mt-3">
        {{ errorMessage }}
      </div>

      <!-- Mensaje de éxito -->
      <div *ngIf="successMessage" class="alert alert-success py-2 mt-3">
        {{ successMessage }}
      </div>

      <!-- Botón formulario -->
      <button
        type="submit"
        class="btn-ingresar"
        [disabled]="isLoading || !loginForm.form.valid"
      >
        {{ isLoading ? 'Ingresando...' : 'Iniciar sesión' }}
      </button>
    </form>
  </div>
</div>
