<div class="page-shell">
  <div class="washes" aria-hidden="true">
    <div class="wash wash-1"></div>
    <div class="wash wash-2"></div>
  </div>
  <div class="ring-deco r1" aria-hidden="true"></div>
  <div class="ring-deco r2" aria-hidden="true"></div>

  <div class="login-card">
    <div class="logo-wrap">
      <img src="assets/images/logo.jpg" alt="Romina Albornoz Logo" />
    </div>
    <div class="brand-name">Romina Albornoz</div>
    <div class="brand-sub">Insumos</div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" novalidate>
      <div class="input-group-custom">
        <label class="form-label" for="username">Usuario</label>
        <div class="field-wrap">
          <i class="bi bi-person field-icon"></i>
          <input
            id="username"
            name="username"
            type="text"
            class="form-control-custom"
            placeholder="Tu usuario"
            [(ngModel)]="username"
            required
          />
        </div>
      </div>
      <div class="input-group-custom">
        <label class="form-label" for="password">Contraseña</label>
        <div class="field-wrap">
          <i class="bi bi-lock field-icon"></i>
          <input
            id="password"
            name="password"
            [type]="showPassword ? 'text' : 'password'"
            class="form-control-custom"
            placeholder="Tu contraseña"
            [(ngModel)]="password"
            required
          />
          <button
            type="button"
            class="field-action-btn"
            [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            (click)="showPassword = !showPassword"
          >
            <i
              class="bi"
              [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"
            ></i>
          </button>
        </div>
      </div>

      <div *ngIf="errorMessage" class="alert alert-danger py-2 mt-3">
        {{ errorMessage }}
      </div>

      <div *ngIf="successMessage" class="alert alert-success py-2 mt-3">
        {{ successMessage }}
      </div>

      <button
        type="submit"
        class="btn-ingresar"
        [disabled]="isLoading || !loginForm.form.valid"
      >
        {{ isLoading ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>
  </div>
</div>
