<div class="mv-overlay" *ngIf="visible" (click)="cerrarModal()">
  <div class="mv-modal" (click)="detenerPropagacion($event)">
    <!-- HEADER -->
    <div class="mv-header">
      <div class="mv-header-info">
        <h3 class="mv-title">
          <i class="bi bi-plus-circle"></i>
          {{ modo === 'crear' ? "Nuevo canal" : "Editar canal" }}
        </h3>
      </div>
      <button
        type="button"
        class="mv-close-btn"
        (click)="cerrarModal()"
        aria-label="Cerrar"
      >
        <i class="bi bi-x"></i>
      </button>
    </div>
    <!-- CONTENIDO -->
    <div class="mv-body">
      <form [formGroup]="formCanal" (ngSubmit)="procesarFormulario()">
        <!-- Datos generales -->
        <div class="nu-section-title">
          <i class="bi bi-square"></i>
          Datos generales
        </div>
        <div class="nu-row">
          <!-- NOMBRE DEL CANAL -->
          <div class="nu-field">
            <label class="nu-label" for="nombre"
              >Nombre del canal<span class="req">*</span></label
            >
            <input
              type="text"
              id="nombre"
              class="nu-input"
              placeholder="Ej: WhatsApp, Facebook, etc."
              formControlName="nombre"
            />
            <div
              *ngIf="formCanal.get('nombre')?.touched && formCanal.get('nombre')?.invalid"
              class="form-error-msg"
            >
              <i class="bi bi-exclamation-circle"></i>
              <div *ngIf="formCanal.get('nombre')?.errors?.['required']">
                El nombre es obligatorio.
              </div>
              <div *ngIf="formCanal.get('nombre')?.errors?.['minlength']">
                El nombre debe tener al menos 3 caracteres.
              </div>
              <div *ngIf="formCanal.get('nombre')?.errors?.['maxlength']">
                El nombre no debe superar los 50 caracteres.
              </div>
            </div>
          </div>
        </div>
        <!-- BOTÓN GUARDAR -->
        <button
          [disabled]="formCanal.invalid || guardando"
          type="submit"
          class="nu-btn-guardar"
        >
          <i class="bi bi-floppy-fill"></i>
          {{ guardando ? 'Guardando...' : 'Guardar canal' }}
        </button>
      </form>
    </div>

    <div class="mv-footer">
      <button type="button" class="mv-btn-cancelar" (click)="cerrarModal()">
        Cancelar
      </button>
    </div>
  </div>
</div>
