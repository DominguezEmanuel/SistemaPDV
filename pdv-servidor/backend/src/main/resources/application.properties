# Nombre de la aplicación
spring.application.name=backend

# URL de conexión a la base de datos PostgreSQL
spring.datasource.url=${DB_URL}
# Usuario y contraseña de PostgreSQL
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Driver JDBC explícito para PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA no debe crear ni modificar tablas; solo validar que el esquema existe y coincida
spring.jpa.hibernate.ddl-auto=validate
# Muestra las consutlas SQL en consola
spring.jpa.show-sql=true
# Formatea el SQL para que se lea mejor en logs
spring.jpa.properties.hibernate.format_sql=true
# Evita mantener el EntityManager abierto durante la vista web
spring.jpa.open-in-view=false

# Cambiar a la hora de despliegue
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

